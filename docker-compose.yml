version: '3.7'
services:
  alas:
    build:
      context: ./deploy/docker/
      dockerfile: ./Dockerfile
    ports:
      - "22267:22267"
    volumes:
      - '.:/app/AzurLaneAutoScript:rw'
      - '/etc/localtime:/etc/localtime:ro'
    environment:
      - AI_SIDECAR_URL=http://host.docker.internal:8484
      - OCR_SERVER_URL=http://host.docker.internal:8484
      - EMULATOR_SERIAL=${EMULATOR_SERIAL:-host.docker.internal:5555}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sidecar:
        condition: service_healthy
    container_name: alas

  # OCR now handled by Rust sidecar on port 8484.
  # Uncomment to use legacy mxnet/cnocr OCR server instead.
  # ocr:
  #   build:
  #     context: ./deploy/docker/
  #     dockerfile: ./Dockerfile.ocr
  #   platform: linux/amd64
  #   ports:
  #     - "22268:22268"
  #   volumes:
  #     - '.:/app/AzurLaneAutoScript:rw'
  #   container_name: alas-ocr

  sidecar:
    build:
      context: ./ai_sidecar
      dockerfile: Dockerfile
    ports:
      - "8484:8484"
    volumes:
      - sidecar-data:/data
      - ./ai_sidecar/prompts:/app/prompts:ro
    environment:
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8484/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    container_name: alas-sidecar

volumes:
  sidecar-data:
