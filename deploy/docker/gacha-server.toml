# gacha-server configuration for the `sidecar` service in docker-compose.yml, mounted at
# /app/config.toml. It follows config.example.toml in
# https://github.com/aurablacklight/rust-gacha-ocr-sidecar, which documents every key.
#
# Keep secrets out of this file: put ANTHROPIC_API_KEY (or OPENROUTER_API_KEY, accepted
# for either provider) in .env. To use another file, set GACHA_SERVER_CONFIG in .env.

[server]
port = 8484
# Must stay 0.0.0.0 in the container. 127.0.0.1 would be the sidecar container's own
# loopback, which the alas container cannot reach.
host = "0.0.0.0"

[ai]
# Anthropic direct, through its OpenAI-compatible endpoint.
base_url = "https://api.anthropic.com/v1"
model = "claude-haiku-5-5"
vision_enabled = true
# Output ceiling, not a target length.
max_tokens = 4096
# Haiku rejects temperature.
omit_temperature = true
timeout_secs = 30

# Alternative: OpenRouter. Replace the [ai] block above with this one and put the
# OpenRouter key in OPENROUTER_API_KEY.
# [ai]
# base_url = "https://openrouter.ai/api/v1"
# model = "google/gemini-2.5-flash-lite"
# vision_enabled = true
# timeout_secs = 30

[logging]
# Used when RUST_LOG is unset.
level = "info"
